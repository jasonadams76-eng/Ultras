<script type="importmap">{"imports":{"three":"./lib/three.module.js","three/addons/":"./lib/addons/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
import {MTLLoader} from 'three/addons/loaders/MTLLoader.js';
import {createTraffic} from './traffic.js';
import {createCivilians} from './civilians.js';
import {createAudio} from './audio.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
const R=(a,b)=>a+Math.random()*(b-a);
const A='./assets/';

// ---------- renderer / scene ----------
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87b8e8);
scene.fog=new THREE.Fog(0x87b8e8,150,700);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1500);
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));
ren.outputColorSpace=THREE.SRGBColorSpace;
ren.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(ren.domElement);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);});
scene.add(new THREE.HemisphereLight(0xffffff,0x556677,1.6));
const sun=new THREE.DirectionalLight(0xfff2dd,2.6);sun.position.set(100,200,50);scene.add(sun);

const loader=new GLTFLoader();
const load=f=>new Promise(res=>loader.load(A+f,g=>res(g),undefined,e=>{console.warn('load failed',f,e);res(null);}));
const [gMale,gFemale,gSmall,gMed,gLarge]=await Promise.all(
  ['Superhero_Male_FullBody.gltf','Superhero_Female_FullBody.gltf','Building_Small_1.gltf','Building_Medium_2_001.gltf','Building_Large_2.gltf'].map(load));
const OUTFITS={}; // (fantasy outfits no longer used; figure() still supports them)
const gTB=await load('Thunder_Bolt.glb'); // Thunder Bolt, same skeleton as Silver Star
const gStar=await load('Silver_Star.glb'); // new Silver Star body, skinned to the Superhero skeleton so every animation drives it
const UAL=await Promise.all(['ual/UAL1_Standard.glb','ual/UAL2_Standard.glb'].map(load)); // Universal Animation Library (same rig as the superhero)
const NPCM={};
await Promise.all(['men_Suit','men_Punk','men_Casual_Hoodie','men_Casual_2','men_Swat','men_King','women_Casual','women_Soldier','women_Punk','men_Worker','men_Farmer','men_Beach','women_Formal','women_Suit','women_Worker']
  .map(async n=>{NPCM[n]=await load('npc/'+n+'.gltf');}));
// ---------- guns (Quaternius Ultimate Gun Pack, CC0): normalised so the wrapper origin is the grip, barrel along +X ----------
const GUNDEF={ // L = length in metres, gx/gy = grip position as a fraction of the gun's length/height
  Pistol_1:{L:.24,gx:.3,gy:.4},Pistol_3:{L:.25,gx:.3,gy:.4},Pistol_4:{L:.27,gx:.3,gy:.4},Revolver_1:{L:.26,gx:.2,gy:.4},Revolver_2:{L:.28,gx:.2,gy:.4},
  SubmachineGun_1:{L:.42,gx:.42,gy:.35},SubmachineGun_3:{L:.5,gx:.42,gy:.35},SubmachineGun_4:{L:.4,gx:.42,gy:.35},
  Bullpup_2:{L:.62,gx:.55,gy:.35},AssaultRifle_3:{L:.6,gx:.45,gy:.35},AssaultRifle2_4:{L:.5,gx:.45,gy:.35},Shotgun_SawedOff:{L:.5,gx:.2,gy:.4}};
const GUNS={};
await Promise.all(Object.keys(GUNDEF).map(async n=>{try{
  const mats=await new MTLLoader().setPath(A+'guns/').loadAsync(n+'.mtl');mats.preload();
  const obj=await new OBJLoader().setMaterials(mats).setPath(A+'guns/').loadAsync(n+'.obj');
  const d=GUNDEF[n];obj.traverse(o=>{if(o.isMesh)[].concat(o.material).forEach(m=>{m.color.multiplyScalar(3.2);m.shininess=40;});}); // OBJ colours are very dark in linear space
  let bb=new THREE.Box3().setFromObject(obj);const sc=d.L/(bb.max.x-bb.min.x);obj.scale.setScalar(sc);obj.updateMatrixWorld(true);bb=new THREE.Box3().setFromObject(obj);
  const gp=new THREE.Vector3(bb.min.x+d.gx*(bb.max.x-bb.min.x),bb.min.y+d.gy*(bb.max.y-bb.min.y),(bb.min.z+bb.max.z)/2);
  obj.position.sub(gp);const w=new THREE.Group();w.add(obj);w.userData.tip=new THREE.Vector3(bb.max.x-gp.x,bb.max.y-gp.y-.02,0);GUNS[n]=w;
}catch(e){console.warn('gun',n,e);}}));
const NAT={};
await Promise.all(['CommonTree_1','CommonTree_2','CommonTree_3','CommonTree_4','CommonTree_5','Pine_1','Pine_2','Pine_3','Bush_Common','Bush_Common_Flowers','Grass_Common_Tall','Rock_Medium_1','Rock_Medium_2','Flower_3_Group','Flower_4_Group']
  .map(async n=>{const g=await load('nature/'+n+'.gltf');if(g){g.scene.traverse(o=>{if(o.isMesh)[].concat(o.material).forEach(m=>{m.vertexColors=false;m.needsUpdate=true;});});NAT[n]=g.scene;}}));

// ---------- ground: streets, sidewalks, curbs, lane markings ----------
const GRID=6, LIMC=GRID*40+20, ST=14;              // city half-size, street width
const asph=new THREE.TextureLoader().load(A+'T_Concrete_Asphalt_BaseColor.png');
asph.wrapS=asph.wrapT=THREE.RepeatWrapping;asph.colorSpace=THREE.SRGBColorSpace;
const grass=new THREE.Mesh(new THREE.PlaneGeometry(1400,1400),new THREE.MeshStandardMaterial({color:0x5a8a45,roughness:1}));
grass.rotation.x=-Math.PI/2;grass.position.y=-.03;scene.add(grass);
// sidewalk texture: 3 m paving slabs with joints and speckle
const swC=document.createElement('canvas');swC.width=swC.height=256;
{const x=swC.getContext('2d');x.fillStyle='#aaa9a3';x.fillRect(0,0,256,256);
 for(let i=0;i<1800;i++){x.fillStyle=`rgba(${Math.random()<.5?255:70},${Math.random()<.5?255:70},${Math.random()<.5?255:70},.05)`;x.fillRect(Math.random()*256,Math.random()*256,2,2);}
 x.strokeStyle='#7d7c77';x.lineWidth=3;x.strokeRect(0,0,256,256);x.beginPath();x.moveTo(128,0);x.lineTo(128,256);x.moveTo(0,128);x.lineTo(256,128);x.stroke();}
const swT=new THREE.CanvasTexture(swC);swT.wrapS=swT.wrapT=THREE.RepeatWrapping;swT.colorSpace=THREE.SRGBColorSpace;swT.anisotropy=4;
swT.repeat.set(LIMC*2/6,LIMC*2/6);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(LIMC*2+2,LIMC*2+2),new THREE.MeshStandardMaterial({map:swT,roughness:.95}));
ground.rotation.x=-Math.PI/2;scene.add(ground);
{ // streets as world-UV quads (so crossing strips line up), curbs and markings merged per material
  const bucket=()=>({p:[],u:[],i:[]});
  const bk={asph:bucket(),curb:bucket(),yel:bucket(),wht:bucket()};
  const quad=(k,x0,z0,x1,z1,y,uvs=1/8.75)=>{const q=bk[k],n=q.p.length/3;
    q.p.push(x0,y,z0, x1,y,z0, x1,y,z1, x0,y,z1);q.u.push(x0*uvs,z0*uvs, x1*uvs,z0*uvs, x1*uvs,z1*uvs, x0*uvs,z1*uvs);
    q.i.push(n,n+2,n+1, n,n+3,n+2);};
  const lanes=[];for(let k=-GRID-1;k<=GRID;k++)lanes.push(k*40+20);
  const E=LIMC+ST/2;
  for(const c of lanes){
    quad('asph',c-ST/2,-E,c+ST/2,E,.02);   // street running along z
    quad('asph',-E,c-ST/2,E,c+ST/2,.021);  // street running along x
    for(let j=-GRID;j<=GRID;j++){
      const m=j*40,z0=m-(40-ST)/2,z1=m+(40-ST)/2;   // one city block's span between two cross streets
      for(const side of [-1,1]){
        const e=c+side*ST/2;
        quad('curb',e-.3,z0,e+.3,z1,.045);                   // curb on a z-running street
        quad('curb',z0,e-.3,z1,e+.3,.045);                   // curb on an x-running street
      }
      for(let t=z0+1.5;t<z1-1.5;t+=6){                          // dashed double-yellow centre line
        quad('yel',c-.28,t,c-.1,t+3,.05);quad('yel',c+.1,t,c+.28,t+3,.05);
        quad('yel',t,c-.28,t+3,c-.1,.05);quad('yel',t,c+.1,t+3,c+.28,.05);
      }
      for(const z of [z0-1.2,z1+1.2])for(let w=-ST/2+3.2;w<ST/2-3.4;w+=1.3){  // zebra crosswalks at each corner
        quad('wht',c+w,z-1.2,c+w+.6,z+1.2,.05);quad('wht',z-1.2,c+w,z+1.2,c+w+.6,.05);
      }
    }
  }
  const mats={asph:new THREE.MeshStandardMaterial({map:asph,roughness:.95}),curb:new THREE.MeshStandardMaterial({color:0xd0cfc9,roughness:.9}),
    yel:new THREE.MeshStandardMaterial({color:0xe3b21a,roughness:.7}),wht:new THREE.MeshStandardMaterial({color:0xeeeeea,roughness:.7})};
  for(const k in bk){const g=new THREE.BufferGeometry(),q=bk[k];
    g.setAttribute('position',new THREE.Float32BufferAttribute(q.p,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(q.u,2));
    g.setIndex(q.i);g.computeVertexNormals();
    const m=new THREE.Mesh(g,mats[k]);m.receiveShadow=true;scene.add(m);}
}

// ---------- city ----------
const B=[];
const protos=[gSmall,gMed,gLarge].filter(Boolean);
protos.forEach(g=>g.scene.traverse(o=>{if(o.isMesh){[].concat(o.material).forEach(m=>{m.vertexColors=false;m.needsUpdate=true;});}}));
const PARKS=[[-3,-1],[2,3],[4,-2]]; // cells left empty for parks
for(let i=-GRID;i<=GRID;i++)for(let j=-GRID;j<=GRID;j++){
  if(!i&&!j)continue; // ORACLE plaza
  if(PARKS.some(([a,b])=>a===i&&b===j))continue;
  const x=i*40,z=j*40;
  let obj;
  if(protos.length){
    obj=protos[Math.floor(Math.random()*protos.length)].scene.clone(true);
    const s=R(1.3,1.7);obj.scale.setScalar(s);
    obj.rotation.y=Math.floor(Math.random()*4)*Math.PI/2;
    obj.position.set(x,0,z);scene.add(obj);obj.updateMatrixWorld(true);
    const bb=new THREE.Box3().setFromObject(obj),c=bb.getCenter(new THREE.Vector3());
    obj.position.x+=x-c.x;obj.position.z+=z-c.z;obj.position.y-=bb.min.y;
    obj.updateMatrixWorld(true);bb.setFromObject(obj);
    let sz=bb.getSize(new THREE.Vector3());
    const fit=Math.min(1,21/Math.max(sz.x,sz.z));
    if(fit<1){obj.scale.multiplyScalar(fit);obj.updateMatrixWorld(true);const c2=new THREE.Box3().setFromObject(obj).getCenter(new THREE.Vector3());obj.position.x+=x-c2.x;obj.position.z+=z-c2.z;obj.position.y-=new THREE.Box3().setFromObject(obj).min.y;obj.updateMatrixWorld(true);bb.setFromObject(obj);sz=bb.getSize(new THREE.Vector3());}
    B.push({x,z,w:sz.x,d:sz.z,h:bb.max.y});
  }else{ // fallback box
    const w=R(16,26),d=R(16,26),h=R(15,95);
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(R(.55,.65),.15,R(.3,.6))}));
    m.position.set(x,h/2,z);scene.add(m);B.push({x,z,w,d,h});
  }
}

// ---------- nature: parks, plaza trees, street trees ----------
const onRoad=(x,z,pad=0)=>{const f=v=>Math.abs(((v-20)%40+60)%40-20)<ST/2+pad;return f(x)||f(z);}; // inside a street strip (either axis)
function freeSpot(x,z,pad=2){return !B.some(b=>Math.abs(x-b.x)<b.w/2+pad&&Math.abs(z-b.z)<b.d/2+pad);}
const LITE=location.search.includes('lite'); // ?lite skips vegetation (for slow machines / screenshots)
// solid scenery: trunk / rock cylinders measured from the models; bushes, flowers and grass stay passable
const OB=[],_sinfo={};
function solidInfo(name,src){
  if(_sinfo[name])return _sinfo[name];
  src.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(src),v=new THREE.Vector3(),lo=[];
  src.traverse(o=>{if(!o.isMesh)return;const p=o.geometry.attributes.position;for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i).applyMatrix4(o.matrixWorld);if(v.y<box.min.y+.6)lo.push(Math.hypot(v.x,v.z));}});
  lo.sort((a,b)=>a-b);
  const tr=lo.length?lo[Math.floor(lo.length*.7)]:.4;
  return _sinfo[name]={trunk:Math.min(1.1,Math.max(.25,tr)),h:box.max.y-box.min.y,hw:Math.max(box.max.x-box.min.x,box.max.z-box.min.z)/2};
}
let _dirtM=null,_dirtG=null;
function dirtPatch(x,z,r){ // a round bed of dirt around a tree trunk, slightly irregular, with a darker rim and a few pebbles
  if(!_dirtM){
    const cv=document.createElement('canvas');cv.width=cv.height=128;const g=cv.getContext('2d');
    g.fillStyle='#5a3d27';g.fillRect(0,0,128,128);
    for(let k=0;k<420;k++){const l=30+Math.random()*22;g.fillStyle='hsl(25,'+(28+Math.random()*14)+'%,'+l+'%)';g.fillRect(Math.random()*128,Math.random()*128,1+Math.random()*3,1+Math.random()*3);}
    const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;
    _dirtM=new THREE.MeshStandardMaterial({map:t,roughness:1,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
    _dirtG=new THREE.MeshStandardMaterial({color:0x3b2818,roughness:1,polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-1});
  }
  const pts=[],pts2=[];
  for(let k=0;k<24;k++){const a=k/24*Math.PI*2,w=1+Math.sin(a*3+x)*.06+Math.sin(a*5+z)*.04;pts.push(new THREE.Vector2(Math.cos(a)*r*w,Math.sin(a)*r*w));pts2.push(new THREE.Vector2(Math.cos(a)*(r*w+.18),Math.sin(a)*(r*w+.18)));}
  const rim=new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(pts2)),_dirtG);rim.rotation.x=-Math.PI/2;rim.position.set(x,.052,z);scene.add(rim);
  const m=new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(pts)),_dirtM);m.rotation.x=-Math.PI/2;m.position.set(x,.056,z);scene.add(m);
  for(let k=0;k<4;k++){const a=Math.random()*6.28,d=Math.random()*r*.85,p=new THREE.Mesh(new THREE.DodecahedronGeometry(.05+Math.random()*.06,0),_dirtG);p.position.set(x+Math.cos(a)*d,.07,z+Math.sin(a)*d);p.scale.y=.6;scene.add(p);}
}
function plant(name,x,z,sc=1){
  const src=NAT[name];if(!src||LITE)return;
  const o=src.clone(true);o.position.set(x,0,z);o.rotation.y=Math.random()*Math.PI*2;o.scale.setScalar(sc);scene.add(o);
  if(/^(CommonTree|Pine|Tree)/.test(name)){const i=solidInfo(name,src);OB.push({x,z,r:i.trunk*sc,h:i.h*sc});dirtPatch(x,z,Math.max(1.0,i.trunk*sc+.7));}
  else if(/^Rock/.test(name)){const i=solidInfo(name,src);OB.push({x,z,r:i.hw*.8*sc,h:i.h*sc});}
}
// push a point (an NPC's feet) out of any building, tree, rock or signal pole; `rad` is its body radius
function ejectXZ(p,rad){
  let moved=false;
  for(const b of B){
    const dx=p.x-b.x,dz=p.z-b.z,hx=b.w/2+rad,hz=b.d/2+rad;
    if(Math.abs(dx)<hx&&Math.abs(dz)<hz){if(hx-Math.abs(dx)<hz-Math.abs(dz))p.x=b.x+Math.sign(dx||1)*hx;else p.z=b.z+Math.sign(dz||1)*hz;moved=true;}
  }
  const one=o=>{const dx=p.x-o.x,dz=p.z-o.z,m=o.r+rad;if(dx*dx+dz*dz<m*m){const d=Math.hypot(dx,dz)||.01;p.x=o.x+dx/d*m;p.z=o.z+dz/d*m;moved=true;}};
  for(const o of OB)one(o);
  if(traffic)for(const o of traffic.solids||[])one(o);
  return moved;
}
const TREES=['CommonTree_1','CommonTree_2','CommonTree_3','CommonTree_4','CommonTree_5','Pine_1','Pine_2','Pine_3'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
for(const [i,j] of PARKS){
  const cx=i*40,cz=j*40;
  const lawn=new THREE.Mesh(new THREE.PlaneGeometry(25,25),new THREE.MeshStandardMaterial({color:0x5c9a48,roughness:1}));
  lawn.rotation.x=-Math.PI/2;lawn.position.set(cx,.03,cz);scene.add(lawn);
  for(let k=0;k<12;k++)plant(pick(TREES),cx+R(-10,10),cz+R(-10,10),R(1.3,2));
  for(let k=0;k<10;k++)plant(pick(['Bush_Common_Flowers']),cx+R(-11,11),cz+R(-11,11),R(1.2,1.8));
  for(let k=0;k<30;k++)plant(pick(['Grass_Common_Tall','Flower_3_Group','Flower_4_Group']),cx+R(-12,12),cz+R(-12,12),R(1.2,2));
  for(let k=0;k<4;k++)plant(pick(['Rock_Medium_1','Rock_Medium_2']),cx+R(-10,10),cz+R(-10,10),R(.8,1.4));
}
// ORACLE plaza: ring of trees + bushes
for(let k=0;k<8;k++){const a=k/8*Math.PI*2+.4,x=Math.cos(a)*11,z=Math.sin(a)*11;if(Math.hypot(x-10,z+10)>4)plant(pick(TREES),x,z,1.5);}
// street trees on random free spots along the streets
for(let k=0;k<160;k++){
  const lane=Math.floor(R(-GRID,GRID))*40+20,off=R(-GRID*40,GRID*40);
  const sd=(Math.random()<.5?-1:1)*(ST/2+1.6),x=k%2?lane+sd:off,z=k%2?off:lane+sd;
  if(!onRoad(x,z,.8)&&freeSpot(x,z,1.5)&&Math.hypot(x,z)>14)plant(pick(['CommonTree_1','CommonTree_3','CommonTree_5','Bush_Common_Flowers']),x,z,R(1.2,1.7));
}
const ring=new THREE.Mesh(new THREE.CylinderGeometry(8,8,.3,32),new THREE.MeshBasicMaterial({color:0x3366ff}));
ring.position.y=.15;scene.add(ring);

// ---------- helpers ----------
const hudEl=document.getElementById('hud'),msgEl=document.getElementById('msg');
let msgT=0;
function msg(t,ms=4500){msgEl.textContent=t;msgEl.style.display='block';clearTimeout(msgT);msgT=setTimeout(()=>msgEl.style.display='none',ms);}
function label(text,y=2.4){
  const c=document.createElement('canvas');c.width=256;c.height=64;
  const x=c.getContext('2d');x.fillStyle='#0009';x.fillRect(0,0,256,64);
  x.fillStyle='#fff';x.font='20px sans-serif';x.textAlign='center';x.fillText(text,128,38);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));
  sp.scale.set(2.0,.5,1);sp.position.y=y;return sp;
}
// character: outer group g (position / yaw), inner pivot (lean, bob)
// keep only head/neck triangles of the base body so an outfit can replace the rest
function headOnly(m){
  const keep=new Set(['Head','neck_01']);
  m.traverse(o=>{
    if(!o.isSkinnedMesh||!/superhero/i.test(o.material.name))return;
    const g=o.geometry.clone(),si=g.attributes.skinIndex,sw=g.attributes.skinWeight,idx=g.index.array,bn=o.skeleton.bones;
    const dom=i=>{let best=0,bw=-1;for(let k=0;k<4;k++){const w=sw.getComponent(i,k);if(w>bw){bw=w;best=si.getComponent(i,k);}}return bn[best].name;};
    const out=[];
    for(let t=0;t<idx.length;t+=3)if(keep.has(dom(idx[t]))&&keep.has(dom(idx[t+1]))&&keep.has(dom(idx[t+2])))out.push(idx[t],idx[t+1],idx[t+2]);
    g.setIndex(out);o.geometry=g;
  });
}
// character: outer group g (position / yaw), inner pivot (lean, bob)
// outfit: null (bare superhero body, tinted) or 'Ranger' / 'Peasant' (fantasy outfit + superhero head)
function figure(kind,tint,s=1,outfit=null){
  const g=new THREE.Group(),pivot=new THREE.Group();g.add(pivot);
  const bones={},rest=new Map(),restP=new Map();let root=null;
  const src=kind==='f'?gFemale:gMale;
  const of=outfit&&OUTFITS[(kind==='f'?'Female_':'Male_')+outfit];
  const addBones=m=>m.traverse(o=>{if(o.isBone){(bones[o.name]=bones[o.name]||[]).push(o);rest.set(o,o.quaternion.clone());restP.set(o,o.position.clone());}});
  if(src){
    const m=SkeletonUtils.clone(src.scene);
    m.traverse(o=>{
      if(o.isMesh||o.isSkinnedMesh){
        o.frustumCulled=false;
        if(!of&&o.material&&/superhero/i.test(o.material.name)){o.material=o.material.clone();o.material.color.set(tint);}
      }
    });
    if(of)headOnly(m);
    pivot.add(m);addBones(m);root=m;
    if(of){
      const om=SkeletonUtils.clone(of.scene);
      om.traverse(o=>{if(o.isMesh||o.isSkinnedMesh)o.frustumCulled=false;});
      pivot.add(om);addBones(om);
    }
  }else{
    const b=new THREE.Mesh(new THREE.BoxGeometry(.6,1.7,.4),new THREE.MeshStandardMaterial({color:tint}));
    b.position.y=.85;pivot.add(b);
  }
  const resetPose=()=>{for(const [b,q] of rest){b.quaternion.copy(q);b.position.copy(restP.get(b));}};
  g.scale.setScalar(s);scene.add(g);return {g,pivot,bones,rest,root,resetPose};
}

// animated NPC from the Ultimate Modular Men/Women packs (own rig + built-in clips), normalised to `height` metres

  if(src){
    const m=SkeletonUtils.clone(src.scene);
    m.traverse(o=>{if(o.isMesh||o.isSkinnedMesh)o.frustumCulled=false;});
    if(look){ // per-character colours (skin, hair, clothes) by material name; clone so other NPCs sharing the model are untouched
      m.traverse(o=>{if(!(o.isMesh||o.isSkinnedMesh))return;
        const arr=[].concat(o.material).map(mt=>{if(look[mt.name]===undefined)return mt;const c=mt.clone();c.color.set(look[mt.name]);return c;});
        o.material=arr.length===1?arr[0]:arr;});
    }
    m.updateMatrixWorld(true);m.traverse(o=>{if(o.isSkinnedMesh)o.skeleton.update();});
    const bb=new THREE.Box3().setFromObject(m,true),h=Math.max(.01,bb.max.y-bb.min.y),sc=height/h; // precise = real skinned size
    m.scale.setScalar(sc);m.position.y=-bb.min.y*sc;pivot.add(m);
    const clips={};for(const c of src.animations)clips[c.name]=c;

      if(hand){gun=GUNS[gunKey].clone(true);gun.userData.tip=GUNS[gunKey].userData.tip;
        const hp=hand.getWorldPosition(new THREE.Vector3());pivot.worldToLocal(hp);gun.position.copy(hp);gun.rotation.y=-Math.PI/2;
        pivot.add(gun);gun.updateMatrixWorld(true);hand.attach(gun);}

// ---------- animation clips (Universal Animation Library -> superhero rig) ----------
const CLIPS={};
{
  const ours=gMale&&gMale.scene.getObjectByName('pelvis');
  for(const g of UAL){
    if(!g)continue;
    const theirs=g.scene.getObjectByName('pelvis');
    const ratio=ours&&theirs&&theirs.position.z?ours.position.z/theirs.position.z:1; // pelvis height is local Z (root bone is rotated -90deg)
    for(const c of g.animations){
      if(CLIPS[c.name])continue;
      const cl=c.clone();
      // the superhero has different bone lengths: keep rotations, drop per-bone translations except the pelvis (scaled)
      cl.tracks=cl.tracks.filter(t=>!t.name.endsWith('.position')||t.name==='pelvis.position');
      const pt=cl.tracks.find(t=>t.name==='pelvis.position');
      if(pt)for(let i=0;i<pt.values.length;i++)pt.values[i]*=ratio;
      CLIPS[c.name]=cl;
    }
  }
}
// small animation controller: loops with crossfades, plus one-shot clips that block locomotion while they play
class Anim{
  constructor(root,clips){this.mixer=new THREE.AnimationMixer(root);this.clips=clips;this.act={};this.cur=null;this.curA=null;this.busy=0;this.hold=false;}
  get(n){if(!this.act[n]){const c=this.clips[n];if(!c)return null;this.act[n]=this.mixer.clipAction(c);}return this.act[n];}
  play(n,{fade=.2,speed=1}={}){
    if(this.busy>0||this.cur===n)return;const a=this.get(n);if(!a)return;
    a.setLoop(THREE.LoopRepeat,Infinity);a.clampWhenFinished=false;a.timeScale=speed;a.reset();
    if(this.curA&&this.curA!==a)this.curA.fadeOut(fade);
    a.fadeIn(fade).play();this.cur=n;this.curA=a;
  }
  once(n,{dur=0,fade=.08,hold=false}={}){
    const a=this.get(n);if(!a)return 0;const clip=this.clips[n];
    const sp=dur>0?Math.max(1,clip.duration/dur):1;
    a.setLoop(THREE.LoopOnce,1);a.clampWhenFinished=true;a.timeScale=sp;a.reset();
    if(this.curA&&this.curA!==a)this.curA.fadeOut(fade);
    a.fadeIn(fade).play();this.cur=n;this.curA=a;this.hold=hold;this.busy=clip.duration/sp;return this.busy;
  }
  update(dt){if(this.busy>0){this.busy-=dt;if(this.busy<=0&&!this.hold)this.cur=null;}this.mixer.update(dt);}
  stop(){this.mixer.stopAllAction();this.cur=null;this.curA=null;this.busy=0;this.hold=false;}
}

// ---------- procedural animation ----------
// Bone axes (probed): upperarm local Z = raise/lower (mirrored L/R), X = swing forward(+)/back(-) (same on both sides);
// lowerarm X = elbow flex (+ = forearm forward, same on both sides); thigh X: + = back; spine Y = twist. Rotation order: rest * Rz * Rx.
const _qa=new THREE.Quaternion(),_qb=new THREE.Quaternion(),_ax={x:new THREE.Vector3(1,0,0),y:new THREE.Vector3(0,1,0),z:new THREE.Vector3(0,0,1)};
function rot(f,name,ops){ // ops: [[axis,angle],...] applied in order after the rest pose
  const bs=f.bones[name];if(!bs)return;
  _qa.identity();for(const [ax,ang] of ops){_qb.setFromAxisAngle(_ax[ax],ang);_qa.multiply(_qb);}
  for(const b of bs)b.quaternion.copy(f.rest.get(b)).multiply(_qa);
}
const lerp=(a,b,t)=>a+(b-a)*t, sstep=t=>t*t*(3-2*t);
// arm: drop = how far lowered from T-pose (rad), fwd = swing forward (rad), elbow = flex (rad); side +1 left / -1 right
function arm(f,side,drop,fwd,elbow){
  const n=side>0?'l':'r';
  rot(f,'upperarm_'+n,[['z',-side*drop],['x',fwd]]);   // probed: Z mirrors left/right, X (forward = +) does not
  rot(f,'lowerarm_'+n,[['x',elbow]]);
}
// punching-arm keyframes (drop, fwd, elbow) over u = 0..1
const GUARD=[1.1,.5,2.0], COCK=[1.15,-.15,2.3], STRIKE=[0,1.45,.08];
function punchKey(u){
  const mix=(A,B,t)=>A.map((v,i)=>lerp(v,B[i],sstep(t)));
  if(u<.3)return mix(GUARD,COCK,u/.3);          // wind up
  if(u<.5)return mix(COCK,STRIKE,(u-.3)/.2);   // strike
  if(u<.62)return STRIKE;                       // hold at full extension
  return mix(STRIKE,GUARD,(u-.62)/.38);        // recover
}
// st: {sw: walk phase swing, fly: 0..1 flight blend, t: time, hand: 'l'|'r', u: punch progress 0..1 (or -1 for none)}
function pose(f,st){
  const {sw=0,fly=0,t=0,hand='r',u=-1}=st;
  const punching=u>=0&&u<=1;
  let L=[1.25-.05*Math.sin(t*2),sw*.6,.15],Rr=[1.25-.05*Math.sin(t*2),-sw*.6,.15]; // relaxed / walk arms
  if(fly>0){ // superhero flight: both arms thrust forward, slight flutter
    const fl=[0,1.45+.05*Math.sin(t*6),.05];
    L=L.map((v,i)=>lerp(v,fl[i],fly));Rr=Rr.map((v,i)=>lerp(v,fl[i],fly));
  }
  if(punching){
    const pk=punchKey(u),guard=GUARD;
    if(hand==='r'){Rr=pk;L=guard;}else{L=pk;Rr=guard;}
  }
  arm(f,1,...L);arm(f,-1,...Rr);
  // legs: walk swing, or streamlined trail in flight
  const leg=lerp(sw,.12,fly);
  rot(f,'thigh_l',[['x',leg]]);rot(f,'thigh_r',[['x',fly>0?lerp(-sw,.22,fly):-sw]]);
  rot(f,'calf_l',[['x',fly*.15]]);rot(f,'calf_r',[['x',fly*.5]]);
  // torso twist + lean into punches (twist sign tuned so the striking shoulder leads)
  let tw=0,lean=0;
  if(punching){
    const amt=u<.3?-sstep(u/.3)*.5:(u<.5?lerp(-.5,.75,sstep((u-.3)/.2)):(u<.62?.75:lerp(.75,0,sstep((u-.62)/.38))));
    tw=(hand==='r'?1:-1)*amt;lean=amt*.12;
  }
  rot(f,'spine_01',[['y',tw*.35]]);rot(f,'spine_02',[['y',tw*.35]]);rot(f,'spine_03',[['y',tw*.3],['x',lean]]);
  rot(f,'neck_01',[['y',-tw*.4]]);
  // head up in flight so the hero looks where they're going
  rot(f,'Head',[['x',-fly*.6]]);
}
// lean the whole body about the hips (pitch, rad) with extra offset; keeps feet from sweeping through the ground
function lean(pivot,pitch,y=0,z=0){
  pivot.rotation.x=pitch;
  pivot.position.set(0,1-Math.cos(pitch)+y,-Math.sin(pitch)+z);
}

// ---------- costumes (data-driven; add new looks here) ----------
const COSTUMES={
  silver_star:{name:'Silver Star',suit:0x9aa2b0,armor:0xc4cad3,trim:0x20232a,emblem:0xffffff,lens:0xff5a3c},
};
function applyCostume(fig,key){
  const C=COSTUMES[key];if(!C)return;
  const bn=n=>fig.bones[n]&&fig.bones[n][0];
  fig.g.updateMatrixWorld(true);
  // 1) suit: repaint the body skin atlas (keep the face island as skin, everything else becomes gunmetal)
  fig.root.traverse(o=>{
    if(!(o.isMesh||o.isSkinnedMesh))return;
    if(o.material&&/hair/i.test(o.material.name)){o.visible=false;return;} // cowl replaces hair
    if(o.material&&/superhero/i.test(o.material.name)){
      const mat=o.material.clone();o.material=mat;
      mat.metalness=.35;mat.roughness=.42;mat.metalnessMap=null;mat.roughnessMap=null;mat.color.set(0xffffff);
      new THREE.TextureLoader().load('assets/T_Superhero_Male_Dark.png',t=>{
        const im=t.image,c=document.createElement('canvas');c.width=im.width;c.height=im.height;
        const x=c.getContext('2d');x.drawImage(im,0,0);
        const col='#'+new THREE.Color(C.suit).getHexString();
        const skin=()=>{x.beginPath();x.rect(0,0,c.width,c.height);x.rect(10,0,385,395);}; // everything except the face island
        x.globalCompositeOperation='saturation';x.fillStyle='#808080';skin();x.fill('evenodd');
        x.globalCompositeOperation='multiply';x.fillStyle=col;skin();x.fill('evenodd');
        // dark skin-tone suit highlights: lift luminance a bit so it reads as gunmetal not black
        x.globalCompositeOperation='source-over';
        const tx=new THREE.CanvasTexture(c);tx.flipY=false;tx.colorSpace=THREE.SRGBColorSpace;tx.anisotropy=4;
        mat.map=tx;mat.needsUpdate=true;
      });
    }
  });
  // 2) armor pieces, authored in model space and then bolted to the matching bones
  const armorM=new THREE.MeshStandardMaterial({color:C.armor,metalness:.75,roughness:.28,emissive:0x15171b});
  const trimM=new THREE.MeshStandardMaterial({color:C.trim,metalness:.5,roughness:.5});
  const starM=new THREE.MeshStandardMaterial({color:C.emblem,emissive:C.emblem,emissiveIntensity:.55,roughness:.4});
  const lensM=new THREE.MeshStandardMaterial({color:C.lens,emissive:C.lens,emissiveIntensity:.9,transparent:true,opacity:.85});
  const put=(boneName,mesh,pos,scl,rot)=>{
    mesh.position.set(...pos);if(scl)mesh.scale.set(...scl);if(rot)mesh.rotation.set(...rot);
    fig.pivot.add(mesh);mesh.updateMatrixWorld(true);bn(boneName).attach(mesh);return mesh;
  };
  const ball=(r)=>new THREE.SphereGeometry(r,20,14);
  const seg=(a,b,r0,r1,mat,boneName)=>{ // tapered cylinder from model-space point a to b
    const A=new THREE.Vector3(...a),Bv=new THREE.Vector3(...b),len=A.distanceTo(Bv);
    const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r0,len,16,1,false),mat);
    m.position.copy(A).add(Bv).multiplyScalar(.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),Bv.clone().sub(A).normalize());
    fig.pivot.add(m);m.updateMatrixWorld(true);bn(boneName).attach(m);return m;
  };
  const wp=n=>{const v=new THREE.Vector3();bn(n).getWorldPosition(v);return fig.pivot.worldToLocal(v);};
  const at=(n,dx,dy,dz)=>{const v=wp(n);return [v.x+dx,v.y+dy,v.z+dz];};
  const lerp=(n1,n2,t)=>{const a=wp(n1),b=wp(n2);return a.lerp(b,t).toArray();};
  for(const [sd,sx] of [['l',1],['r',-1]]){
    // shoulder cap
    put('upperarm_'+sd,new THREE.Mesh(ball(.085),armorM),at('upperarm_'+sd,sx*.03,.02,0),[1.05,.8,1.05]);
    // forearm guard + elbow cuff
    seg(lerp('lowerarm_'+sd,'hand_'+sd,.25),lerp('lowerarm_'+sd,'hand_'+sd,.92),.062,.05,armorM,'lowerarm_'+sd);
    seg(lerp('lowerarm_'+sd,'hand_'+sd,.0),lerp('lowerarm_'+sd,'hand_'+sd,.14),.066,.066,trimM,'lowerarm_'+sd);
    // thigh plate, knee pad, shin guard, boot cuff
    seg(lerp('thigh_'+sd,'calf_'+sd,.15),lerp('thigh_'+sd,'calf_'+sd,.8),.105,.085,armorM,'thigh_'+sd);
    put('calf_'+sd,new THREE.Mesh(ball(.07),armorM),at('calf_'+sd,0,.02,.07),[1,1.05,.8]);
    seg(lerp('calf_'+sd,'foot_'+sd,.18),lerp('calf_'+sd,'foot_'+sd,.82),.085,.07,armorM,'calf_'+sd);
    seg(lerp('calf_'+sd,'foot_'+sd,.86),lerp('calf_'+sd,'foot_'+sd,1.0),.074,.074,trimM,'foot_'+sd);
  }
  // belt + buckle
  put('pelvis',new THREE.Mesh(new THREE.CylinderGeometry(.19,.19,.07,24),trimM),at('pelvis',0,.07,0),[1,1,.78]);
  put('pelvis',new THREE.Mesh(new THREE.BoxGeometry(.075,.06,.03),armorM),at('pelvis',0,.07,.15));
  // chest plates + abdomen + star emblem
  for(const sx of [1,-1])put('spine_03',new THREE.Mesh(ball(.115),armorM),at('spine_03',sx*.075,.07,.13),[1,.85,.5]);
  put('spine_03',new THREE.Mesh(new THREE.CylinderGeometry(.15,.12,.14,20),armorM),at('spine_03',0,-.14,.07),[1,1,.72]);
  const st=new THREE.Shape(),R=.075,r=.03;
  for(let i=0;i<10;i++){const a=Math.PI/2+i*Math.PI/5,rr=i%2?r:R;i?st.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):st.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);}
  put('spine_03',new THREE.Mesh(new THREE.ExtrudeGeometry(st,{depth:.012,bevelEnabled:false}),starM),at('spine_03',0,.07,.2));
  // cowl: shell over the skull, open face, ridge fin, glowing lens strips
  // fitted cowl: ellipsoid matched to the measured skull, covers the crown to the brow and wraps ears/nape; face stays open
  const cowlM=armorM.clone();cowlM.side=THREE.DoubleSide;
  const CS=[.092,.12,.108],CP=[-.002,.092,.02];  // ellipsoid radii and centre (relative to Head bone)
  const cap=new THREE.Mesh(new THREE.SphereGeometry(1,32,16,0,Math.PI*2,0,Math.PI*.42),cowlM);
  put('Head',cap,at('Head',...CP),CS);
  const wrap=new THREE.Mesh(new THREE.SphereGeometry(1,32,12,Math.PI*.5+.85,Math.PI*2-1.7,Math.PI*.42,Math.PI*.3),cowlM);
  put('Head',wrap,at('Head',...CP),CS);
  put('Head',new THREE.Mesh(new THREE.BoxGeometry(.016,.06,.15),trimM),at('Head',0,.2,-.01),null,[.3,0,0]); // ridge fin
  // eye lenses: slanted glowing red-orange slits over the eyes
  const lensShape=new THREE.Shape();lensShape.moveTo(-.026,-.004);lensShape.quadraticCurveTo(0,.016,.026,.006);lensShape.quadraticCurveTo(0,-.016,-.026,-.004);
  for(const sx of [1,-1]){
    const L=new THREE.Mesh(new THREE.ShapeGeometry(lensShape),lensM);L.material.side=THREE.DoubleSide;
    put('Head',L,at('Head',-.009+sx*.039,.078,.128),[sx,1,1],[0,sx*-.12,sx*.22]);
    const rim=new THREE.Mesh(new THREE.ShapeGeometry(lensShape),trimM);rim.material.side=THREE.DoubleSide;
    put('Head',rim,at('Head',-.009+sx*.039,.078,.1265),[sx*1.35,1.9,1],[0,sx*-.12,sx*.22]);
  }
  fig.costume=key;
}

    close(opts?(sel===0?'yes':'no'):'done');

function cuffSetup(e){
  const b={};
  e.g.traverse(o=>{if(!o.isBone)return;let m;
    if((m=/^UpperArm[._]?([LR])$/.exec(o.name)))b['u'+m[1]]=o;
    else if((m=/^LowerArm[._]?([LR])$/.exec(o.name)))b['l'+m[1]]=o;
    else if((m=/^Wrist[._]?([LR])$/.exec(o.name)))b['w'+m[1]]=o;
    else if(o.name==='Hips')b.hips=o;});
  if(!(b.uL&&b.uR&&b.lL&&b.lR&&b.wL&&b.wR&&b.hips)){e.cuffFail=true;return null;}
  b.rL=new THREE.Mesh(cuffRingGeo,cuffMat);b.rR=new THREE.Mesh(cuffRingGeo,cuffMat);b.bar=new THREE.Mesh(cuffBarGeo,cuffMat);

function poseArms(e,C){
  e.g.updateMatrixWorld(true);
  const y=e.g.rotation.y,fx=Math.sin(y),fz=Math.cos(y),k=e.t.s;
  const H=C.hips.getWorldPosition(new THREE.Vector3());
  const back=new THREE.Vector3(-fx,0,-fz),R=new THREE.Vector3(-fz,0,fx);
  const ease=C.blend*C.blend*(3-2*C.blend),pos={};
  for(const s of ['L','R']){
    const U=C['u'+s],L=C['l'+s],W=C['w'+s];
    const q0u=U.quaternion.clone(),q0l=L.quaternion.clone();
    const sh=U.getWorldPosition(new THREE.Vector3()).sub(H),sgn=Math.sign(sh.x*R.x+sh.z*R.z)||1;
    const side=R.clone().multiplyScalar(sgn);
    const T=H.clone().addScaledVector(back,.17*k).addScaledVector(side,.035*k);T.y+=.03*k;
    const pole=back.clone().multiplyScalar(.6).addScaledVector(side,.8);pole.y=-.4;
    ik2(U,L,W,T,pole.normalize());
    const q1u=U.quaternion.clone(),q1l=L.quaternion.clone();
    U.quaternion.copy(q0u).slerp(q1u,ease);L.quaternion.copy(q0l).slerp(q1l,ease);U.updateMatrixWorld(true);
    const wp=W.getWorldPosition(new THREE.Vector3()),lp=L.getWorldPosition(new THREE.Vector3());
    const dir=wp.clone().sub(lp).normalize(),ring=s==='L'?C.rL:C.rR;
    ring.position.copy(wp).addScaledVector(dir,-.02*k);ring.quaternion.setFromUnitVectors(_Z,dir);ring.scale.setScalar(k);

  C.bar.position.copy(pos.L).add(pos.R).multiplyScalar(.5);C.bar.scale.set(k,Math.max(.01,dd),k);

}
function cuffUpdate(e,dt){ // called every frame for downed/arrested suspects
  if(e.cuffFail)return;
  if(e.cuffed){
    if(!e.cuff)e.cuff=cuffSetup(e);
    const C=e.cuff;if(!C)return;
    C.blend=Math.min(1,C.blend+dt/.35);
    poseArms(e,C);
    for(const m of [C.rL,C.rR,C.bar])m.visible=e.g.visible;
  }else if(e.cuff&&e.cuff.rL.visible){
    for(const m of [e.cuff.rL,e.cuff.rR,e.cuff.bar])m.visible=false;e.cuff.blend=0;
  }
}

function damageEnemy(e,amt,now){
  e.hp-=amt;
  e.bar.scale.x=Math.max(.01,2*e.hp/e.t.hp);
  if(e.hp>0&&e.anim&&e.atk<0)e.anim.once('HitRecieve',{dur:.35});
  if(e.hp<=0){
    traffic.noteDefeat(e);e.alive=false;e.down=true;e.loaded=false;e.cuffed=false;e.claimedBy=null;e.respawnAt=now+e.t.fb;e.hideAt=Infinity;P.xp+=10;e.atk=-1;e.bar.visible=false;

  if(blastCd>0)return;blastCd=.3;

const keys={};let yaw=0,pitch=.3,mouseDown=false,clockT=0;
addEventListener('keydown',e=>{
  if(SEL.open){if(!e.repeat)SEL.key(e.code);e.preventDefault();return;}

// ---------- gamepad (standard layout: Xbox / PlayStation / most USB pads) ----------
// L-stick move · R-stick camera · A jump/rise · B descend · X punch · Y talk · RT/RB blast · LT/L3 sprint · LB toggle fly
const PAD={on:false,mx:0,my:0,rx:0,ry:0,jump:false,down:false,sprint:false,fire:false,prev:[]};
const DEAD=.18;
const dz=v=>Math.abs(v)<DEAD?0:Math.sign(v)*(Math.abs(v)-DEAD)/(1-DEAD);
addEventListener('gamepadconnected',e=>{PAD.on=true;msg('Controller connected: '+e.gamepad.id.slice(0,40),3500);});
addEventListener('gamepaddisconnected',()=>{PAD.on=false;PAD.mx=PAD.my=PAD.rx=PAD.ry=0;PAD.jump=PAD.down=PAD.sprint=PAD.fire=false;});
function pollPad(){
  const pads=(navigator.getGamepads&&navigator.getGamepads())||[];
  const g=[...pads].find(p=>p&&p.connected);
  if(!g){PAD.mx=PAD.my=PAD.rx=PAD.ry=0;PAD.jump=PAD.down=PAD.sprint=PAD.fire=false;return;}
  PAD.on=true;
  const b=i=>!!(g.buttons[i]&&g.buttons[i].pressed);
  PAD.raw={b:Array.from(g.buttons,x=>!!x.pressed),ax:Array.from(g.axes),id:g.id||''}; // for the on-screen controller diagram
  PAD.mx=dz(g.axes[0]||0);PAD.my=dz(g.axes[1]||0);PAD.rx=dz(g.axes[2]||0);PAD.ry=dz(g.axes[3]||0);
  PAD.jump=b(0);PAD.down=b(1);PAD.sprint=b(6)||b(10)||(g.buttons[6]&&g.buttons[6].value>.5);PAD.fire=b(7)||b(5);
  const now=[b(2),b(3),b(4)];
  if(now[0]&&!PAD.prev[0])melee(clockT);   // X: punch
  if(now[1]&&!PAD.prev[1])interact();      // Y: talk
  if(now[2]&&!PAD.prev[2])P.fly=!P.fly;    // LB: fly on/off
  PAD.prev=now;
}

      if(e.cuffed||e.cuff)cuffUpdate(e,dt);
      if(e.g.visible&&now>=e.hideAt)e.g.visible=false;
      if(now>=e.respawnAt&&(e.loaded||Math.hypot(P.pos.x-e.home.x,P.pos.z-e.home.z)>40)){e.down=false;e.loaded=false;e.cuffed=false;e.claimedBy=null;e.alive=true;e.hp=e.t.hp;e.bar.scale.x=2;e.bar.visible=true;e.g.position.copy(e.home);ejectXZ(e.g.position,.55*e.t.s);e.retreat=0;e.g.visible=true;e.atk=-1;if(A){A.stop();A.play('Idle',{fade:0});}}
      continue;
    }
    e.cd-=dt;
    // target: the hero, unless a police officer is closer
    let tg={x:P.pos.x,y:P.pos.y,z:P.pos.z,hero:true};
    {let bd=Math.hypot(tg.x-e.g.position.x,tg.z-e.g.position.z);
     for(const o of traffic.police.officers){if(!o.alive||!o.g.visible)continue;const d=Math.hypot(o.g.position.x-e.g.position.x,o.g.position.z-e.g.position.z);if(d<bd&&d<32){bd=d;tg={x:o.g.position.x,y:0,z:o.g.position.z,hero:false};}}}
    const dx=tg.x-e.g.position.x,dz=tg.z-e.g.position.z,h=Math.hypot(dx,dz);
    let state='Idle';
    if(e.retreat>0)e.retreat-=dt;
    if(e.atk>=0){ // mid-punch: stand and swing, damage lands on the strike frame
      e.atk+=dt/.7;
      if(e.hit&&e.atk>=.45){e.hit=false;if(h<3.4*e.t.s&&P.pos.y<3)hurtPlayer(e.t.dmg);}
      if(e.atk>=1)e.atk=-1;
      if(h>0.01)e.g.rotation.y=Math.atan2(dx,dz);
    }else if(h<35&&(P.pos.y<8||!tg.hero)&&!(e.retreat>0)){
      const ranged=e.gun&&h>3.6*e.t.s;                  // armed enemies keep their distance and shoot; close in = fists
      if(ranged){
        if(h>e.t.rng){e.g.position.x+=dx/h*e.t.spd*dt;e.g.position.z+=dz/h*e.t.spd*dt;state='Run';}
        else{state='Idle_Gun_Pointing';if(e.cd<=0)enemyShoot(e,tg);}
      }else if(h>1.8*e.t.s){e.g.position.x+=dx/h*e.t.spd*dt;e.g.position.z+=dz/h*e.t.spd*dt;state='Run';}
      e.g.rotation.y=Math.atan2(dx,dz);
      if(!ranged&&tg.hero&&h<2.2*e.t.s&&P.pos.y<2.5&&e.cd<=0){e.atk=0;e.hit=true;e.cd=1.2;if(A)A.once(Math.random()<.5?'Punch_Left':'Punch_Right',{dur:.7});}
    }else{
      const hx=e.home.x-e.g.position.x,hz=e.home.z-e.g.position.z,hh=Math.hypot(hx,hz);
      if(hh>1){e.g.position.x+=hx/hh*4*dt;e.g.position.z+=hz/hh*4*dt;e.g.rotation.y=Math.atan2(hx,hz);state='Walk';}
    }
    // walls, trees and poles are solid for enemies too (and anyone found inside one is pushed out)
    ejectXZ(e.g.position,.55*e.t.s);
    // chasing but not getting anywhere (stuck behind a building)? give up and walk home for a while
    if(state==='Run'){e.chk=(e.chk||0)+dt;if(e.chk>=1){e.chk=0;if(e.lastH!==undefined&&e.lastH-h<.5)e.stuck=(e.stuck||0)+1;else e.stuck=0;e.lastH=h;if(e.stuck>=4){e.retreat=8;e.stuck=0;}}}
    else{e.chk=0;e.lastH=undefined;e.stuck=0;}
    if(A){if(e.atk<0)A.play(state,{fade:.2});A.update(dt);}
  }
  // quest givers: idle animation, turn to face a nearby hero
  for(const gv of givers){
    if(gv.anim)gv.anim.update(dt);
    const dx=P.pos.x-gv.g.position.x,dz=P.pos.z-gv.g.position.z;
    if(Math.hypot(dx,dz)<14){const a=Math.atan2(dx,dz);let d=a-gv.g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));gv.g.rotation.y+=d*Math.min(1,dt*5);}
  }

  ui.update(dt);
  hudEl.innerHTML=`XP ${P.xp} &nbsp; ${P.fly?'FLYING':'GROUND'}<br>`+
    `${traffic.stats.active?'<span style="color:#7fb0ff">POLICE ON SCENE</span> · ':''}Officers down ${traffic.stats.down} · Arrests ${traffic.stats.arrests}<br>`+
    `Quest: ${active?`${active.title} ${Math.min(prog,active.n)}/${active.n}${prog>=active.n?' (turn in)':''}`:'none (talk to '+Q[qi].giver+')'}`;
  {const o=window.__game.dbg.camOv;if(o){const e=o();cam.position.copy(e.p);cam.lookAt(e.l);}}
}
loop();
</script></body></html>
